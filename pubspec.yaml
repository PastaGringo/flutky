name: flutky
description: "A new Flutter project."
publish_to: 'none'
version: 0.15.0+15

environment:
  sdk: ^3.12.0

dependencies:
  app_links: ^7.2.1
  cryptography: ^2.9.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.0.0
  http: ^1.6.0
  intl: ^0.20.2
  package_info_plus: ^10.2.1
  # Picking a photo. Resizing is done by the picker itself, so an 8 MB
  # phone snapshot does not travel whole over mobile data.
  image_picker: ^1.2.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true
